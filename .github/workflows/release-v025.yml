name: Publish NetWatch v0.2.5 release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: netwatch-v025-release

jobs:
  windows:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: release
        name: Check release version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.2.5') { exit 0 }
          gh release view v0.2.5 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          'build=true' >> $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.release.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.release.outputs.build == 'true'
        run: npm ci
      - name: Build and smoke test the Windows installer
        if: steps.release.outputs.build == 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/package-windows.ps1 -Compiler $compiler
          $installer = Get-Item -LiteralPath '.tools/release/NetWatch-0.2.5-Windows-x64-Setup.exe'
          $prefix = Join-Path $env:RUNNER_TEMP 'netwatch-release-smoke'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $prefix + '"') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)." }
          $launcher = Get-Item -LiteralPath (Join-Path $prefix 'NetWatch.exe')
          if ($launcher.VersionInfo.FileVersion -ne '0.2.5.0') { throw 'Unexpected installed launcher version.' }
          Push-Location $prefix
          try {
            $env:NETWATCH_DB = Join-Path $env:RUNNER_TEMP 'netwatch-release-smoke.sqlite'
            & './node.exe' --input-type=module --eval "import {openStore} from './host/store.js'; const s=openStore(process.env.NETWATCH_DB); if(s.read().topology.nodes.length || s.db.prepare('PRAGMA user_version').get().user_version!==14) process.exitCode=1; s.close()"
            if ($LASTEXITCODE -ne 0) { throw 'Installed host failed database smoke test.' }
          } finally { Pop-Location }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.release.outputs.build == 'true'
        with:
          name: windows-release
          path: .tools/release/NetWatch-0.2.5-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q '"version": "0.2.5"' package.json || exit 0
          if gh release view v0.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          echo build=true >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.release.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.release.outputs.build == 'true'
        run: npm ci
      - name: Build and smoke test the Linux host archive
        if: steps.release.outputs.build == 'true'
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}
        run: |
          npm run build
          package="$ARCHIVE_ROOT/NetWatch-0.2.5-Linux-x64"
          mkdir -p "$package"
          cp -r dist host src package.json package-lock.json LICENSE "$package/"
          cp docs/LINUX.md "$package/README.md"
          (
            cd "$package"
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
            NETWATCH_DB="$ARCHIVE_ROOT/linux-smoke.sqlite" NETWATCH_ICMP=0 NETWATCH_SNMP=0 NETWATCH_DISCOVERY=0 NETWATCH_LAN=0 node host/main.js &
            host_pid=$!
            trap 'kill "$host_pid" 2>/dev/null || true' EXIT
            curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4317/api/v1/health
            curl --fail http://127.0.0.1:4317/ | grep -q '<title>NetWatch'
          )
          tar -czf NetWatch-0.2.5-Linux-x64.tar.gz -C "$ARCHIVE_ROOT" "$(basename "$package")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.release.outputs.build == 'true'
        with:
          name: linux-release
          path: NetWatch-0.2.5-Linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q '"version": "0.2.5"' package.json || exit 0
          if gh release view v0.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          echo publish=true >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.release.outputs.publish == 'true'
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Publish both platform assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd release
          sha256sum NetWatch-0.2.5-Windows-x64-Setup.exe NetWatch-0.2.5-Linux-x64.tar.gz > SHA256SUMS.txt
          awk '/^## v0\.2\.5 / { show=1; next } show && /^## / { exit } show { print }' ../CHANGELOG.md > notes.md
          test -s notes.md
          gh release create v0.2.5 NetWatch-0.2.5-Windows-x64-Setup.exe NetWatch-0.2.5-Linux-x64.tar.gz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'NetWatch v0.2.5' --notes-file notes.md --latest
