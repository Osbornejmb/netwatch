name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Compile Windows tray launcher
        if: runner.os == 'Windows'
        run: npm run desktop:setup
      - name: Windows ICMP loopback smoke (no external targets)
        if: runner.os == 'Windows'
        run: node scripts/check-windows-icmp.mjs --loopback
      - name: Windows host lifecycle (temporary database, loopbacks only)
        if: runner.os == 'Windows'
        run: node scripts/check-windows-host.mjs --loopback
