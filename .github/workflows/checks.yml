name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, lts/*]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Compile Windows tray launcher
        if: runner.os == 'Windows'
        run: npm run desktop:setup
      - name: Windows ICMP loopback smoke (no external targets)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force .tools/evidence | Out-Null
          node scripts/check-windows-icmp.mjs --loopback | Tee-Object .tools/evidence/windows-icmp.txt
      - name: Windows host lifecycle (temporary database, loopbacks only)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force .tools/evidence | Out-Null
          node scripts/check-windows-host.mjs --loopback | Tee-Object .tools/evidence/windows-host.txt
      - name: Upload Windows loopback evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-loopback-evidence-${{ strategy.job-index }}
          path: .tools/evidence/windows-*.txt
          if-no-files-found: ignore
          include-hidden-files: true
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_MODULE: playwright
      NETWATCH_URL: http://127.0.0.1:4173
      NETWATCH_SCALE_URL: http://127.0.0.1:4173
      NETWATCH_HOST_URL: http://127.0.0.1:4317
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run fixture-based browser checks
        shell: bash
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          export NETWATCH_DB="$RUNNER_TEMP/netwatch-browser.sqlite"
          ./node_modules/.bin/vite preview --host 127.0.0.1 --strictPort &
          preview_pid=$!
          node host/main.js &
          host_pid=$!
          trap 'kill "$preview_pid" "$host_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$NETWATCH_URL/" >/dev/null
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$NETWATCH_HOST_URL/api/v1/health" >/dev/null
          # Windows release-device validation needs a real, explicitly authorized device.
          for script in scripts/check-*-browser.mjs; do
            # The remote check needs a LAN URL and disposable login credentials.
            if [ "$script" = scripts/check-remote-browser.mjs ]; then continue; fi
            node "$script"
          done
      - name: Upload fixture browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-browser-evidence
          path: .tools/evidence/
          if-no-files-found: ignore
          include-hidden-files: true
